<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management Dashboard</h1>

        <!-- Student Form -->
        <div class="form-section">

            <h2>Add Student</h2>

            <form id="studentForm">

                <input
                    type="text"
                    id="studentName"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="number"
                    id="studentAge"
                    placeholder="Age"
                    required
                >

                <input
                    type="text"
                    id="studentCourse"
                    placeholder="Course"
                    required
                >

                <input
                    type="email"
                    id="studentEmail"
                    placeholder="Email"
                    required
                >

                <button type="submit" id="submitButton">
                    Add Student
                </button>

            </form>

        </div>

        <!-- Search and Filter -->
        <div class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search student..."
            >

            <select id="courseFilter">

                <option value="all">All Courses</option>

                <option value="B.Tech">B.Tech</option>

                <option value="BCA">BCA</option>

                <option value="MCA">MCA</option>

                <option value="BBA">BBA</option>

            </select>

        </div>

        <!-- Student Table -->
        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Course</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="studentTableBody">
                    <!-- Students will be added here using JavaScript -->
                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
